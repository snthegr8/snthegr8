<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ù  snthegr8</title>
  <desc id="desc">Japanese mokumoku banner with enso and sumi ink wash</desc>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0.045 0" in="n" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <radialGradient id="wash" cx="72%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#1a1816" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#0e0d0c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f4ede1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e0d0c" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0e0d0c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e0d0c" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- washi field -->
  <rect width="1200" height="420" fill="#f4ede1" filter="url(#paper)"/>
  <rect width="1200" height="420" fill="url(#wash)"/>

  <!-- faint vertical rules like a scroll -->
  <g stroke="#0e0d0c" stroke-opacity="0.06" stroke-width="1">
    <line x1="64" y1="36" x2="64" y2="384"/>
    <line x1="1136" y1="36" x2="1136" y2="384"/>
  </g>

  <!-- vermilion corner mark -->
  <rect x="64" y="48" width="18" height="4" fill="#c8372d"/>

  <!-- small roman label -->
  <text x="92" y="56" fill="#6b6661" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="6">MOKUMOKU · Ù</text>

  <!-- enso  imperfect brush circle -->
  <g transform="translate(920,210)">
    <path
      d="M-78,-12
         C-78,-78 -28,-108 22,-98
         C78,-86 108,-28 98,22
         C88,78 28,108 -22,96
         C-72,84 -108,28 -98,-18"
      fill="none"
      stroke="#0e0d0c"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-opacity="0.88"
      transform="rotate(-18)"
    />
    <!-- brush lift gap -->
    <path
      d="M-86,-6 C-90,8 -86,22 -78,30"
      fill="none"
      stroke="#f4ede1"
      stroke-width="14"
      stroke-linecap="round"
    />
    <!-- ink bleed -->
    <circle cx="70" cy="-62" r="3.5" fill="#0e0d0c" fill-opacity="0.35"/>
    <circle cx="-74" cy="48" r="2.2" fill="#0e0d0c" fill-opacity="0.25"/>
  </g>

  <!-- main kanji -->
  <text x="64" y="210" fill="#0e0d0c" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Songti SC', serif" font-size="128" font-weight="600" letter-spacing="18">Ù</text>

  <!-- reading + meaning -->
  <text x="72" y="252" fill="#6b6661" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3">moku · moku    work in quiet focus</text>

  <!-- identity strip -->
  <rect x="64" y="300" width="520" height="1" fill="url(#inkFade)"/>
  <text x="64" y="338" fill="#0e0d0c" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600">Somtochukwu Nnalue</text>
  <text x="64" y="368" fill="#6b6661" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.5">snthegr8  ·  fullstack  ·  building @ alvinn.app</text>

  <!-- hanko seal -->
  <g transform="translate(1088,340)">
    <rect x="-28" y="-28" width="56" height="56" rx="4" fill="none" stroke="#c8372d" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" fill="#c8372d" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif" font-size="22" font-weight="700">'</text>
  </g>
</svg>
